<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臺灣金融股即時量化與策略評估儀表板 (2026-06-18)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-dark: #070d0b;
      --panel-dark: rgba(18, 30, 26, 0.75);
      --panel-border: rgba(255, 255, 255, 0.08);
      --panel-border-hover: rgba(212, 175, 55, 0.4);
      --gold: #d4af37;
      --gold-dark: #aa8416;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-faint: #6b7280;
      
      --taiwan-rise: #ef4444;       /* 紅漲 */
      --taiwan-fall: #10b981;       /* 綠跌 */
      
      --forest-green: #0d2720;
      --glass-glow: radial-gradient(circle at top left, rgba(212, 175, 55, 0.15), transparent 60%);
      --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      
      --btn-gold: linear-gradient(135deg, #e5c158 0%, #aa8416 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(13, 39, 32, 0.8) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(20, 30, 25, 0.9) 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      backdrop-filter: blur(12px);
      background: rgba(8, 15, 12, 0.85);
      border-bottom: 1px solid var(--panel-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 40px;
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: var(--btn-gold);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #070d0b;
      font-size: 1.4rem;
      font-weight: 900;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .logo-text h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .logo-text p {
      font-size: 0.72rem;
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 2px;
      margin-top: 2px;
    }

    .market-status {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 16px;
      border: 1px solid var(--panel-border);
      border-radius: 30px;
      font-size: 0.8rem;
    }

    .market-status span.pulse {
      width: 8px;
      height: 8px;
      background: var(--taiwan-rise);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--taiwan-rise);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    main {
      max-width: 1600px;
      width: 100%;
      margin: 30px auto;
      padding: 0 40px;
      flex-grow: 1;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 30px;
    }

    /* Left panel: List */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--gold);
    }

    .panel-header h2 {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.15rem;
      color: #fff;
    }

    .panel-header .subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .stock-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: calc(100vh - 220px);
      padding-right: 5px;
    }

    /* Scrollbar */
    .stock-list::-webkit-scrollbar {
      width: 6px;
    }
    .stock-list::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
    }
    .stock-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
    }
    .stock-list::-webkit-scrollbar-thumb:hover {
      background: var(--gold);
    }

    .stock-card {
      background: var(--panel-dark);
      border: 1px solid var(--panel-border);
      border-left: 4px solid var(--text-faint);
      border-radius: 6px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .stock-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--glass-glow);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .stock-card:hover {
      border-color: var(--panel-border-hover);
      transform: translateX(5px);
      box-shadow: var(--card-shadow);
    }

    .stock-card:hover::after {
      opacity: 1;
    }

    .stock-card.active {
      background: rgba(25, 45, 38, 0.85);
      border-color: var(--gold);
      border-left-color: var(--gold);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
    }

    .stock-card.active::after {
      opacity: 1;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .stock-info {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .stock-info .name {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }

    .stock-info .code {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .action-tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid transparent;
    }

    .action-tag.gold {
      color: #fff7e6; background: rgba(212, 175, 55, 0.25); border-color: var(--gold);
    }
    .action-tag.silver {
      color: #f5f5f5; background: rgba(255, 255, 255, 0.12); border-color: #d1d5db;
    }
    .action-tag.bronze {
      color: #e6f7ff; background: rgba(59, 130, 246, 0.2); border-color: #3b82f6;
    }
    .action-tag.blue {
      color: #e8f9f5; background: rgba(16, 185, 129, 0.2); border-color: #10b981;
    }

    .card-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-price {
      font-size: 1.25rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
    }

    .card-change {
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .card-change.up {
      color: var(--taiwan-rise);
    }
    .card-change.down {
      color: var(--taiwan-fall);
    }
    .card-change.flat {
      color: var(--text-muted);
    }

    /* Right panel: Details */
    .details-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass-panel {
      background: var(--panel-dark);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 24px;
      box-shadow: var(--card-shadow);
      position: relative;
    }

    .glass-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--btn-gold);
      border-radius: 8px 8px 0 0;
    }

    .detail-header-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 20px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 20px;
    }

    .detail-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .detail-title-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .detail-title-row h2 {
      font-family: 'Noto Serif TC', serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
    }

    .detail-title-row .code-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .category-label {
      font-size: 0.8rem;
      color: var(--gold);
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .detail-price-box {
      text-align: right;
    }

    .detail-price {
      font-size: 2.6rem;
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      line-height: 1.1;
    }

    .detail-change {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .detail-change.up { color: var(--taiwan-rise); }
    .detail-change.down { color: var(--taiwan-fall); }

    .summary-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 18px;
      margin-top: 20px;
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--text-main);
    }

    /* Key metrics grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 16px;
      text-align: center;
      transition: transform 0.2s;
    }

    .metric-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.15);
    }

    .metric-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .metric-value {
      font-size: 1.45rem;
      font-weight: 700;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    }

    .metric-value.gold-text {
      color: var(--gold);
    }

    .metric-sub {
      font-size: 0.68rem;
      color: var(--text-faint);
      margin-top: 4px;
    }

    /* Chart section */
    .charts-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .chart-box {
      background: var(--panel-dark);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: var(--card-shadow);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--panel-border);
    }

    .chart-header h3 {
      font-family: 'Noto Serif TC', serif;
      font-size: 0.95rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-header h3 i {
      color: var(--gold);
    }

    .chart-canvas-wrap {
      position: relative;
      height: 250px;
      width: 100%;
    }

    /* Two columns: news & strategy */
    .split-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
    }

    /* Strategy box */
    .strategy-box {
      background: var(--panel-dark);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .strategy-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.05rem;
      color: #fff;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .strategy-title i {
      color: var(--gold);
    }

    .strategy-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .strategy-table td {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .strategy-table tr:last-child td {
      border-bottom: 0;
    }

    .strategy-table td.label {
      color: var(--text-muted);
      width: 35%;
    }

    .strategy-table td.val {
      font-weight: 700;
      color: #fff;
      text-align: right;
    }

    .strategy-table td.val.entry {
      color: var(--gold);
    }

    .strategy-table td.val.target {
      color: var(--taiwan-rise);
    }

    .strategy-table td.val.stop {
      color: var(--taiwan-fall);
    }

    .warning-panel {
      background: rgba(239, 68, 68, 0.08);
      border-left: 3px solid var(--taiwan-rise);
      border-radius: 4px;
      padding: 12px 14px;
      font-size: 0.78rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 5px;
    }

    .warning-panel strong {
      color: var(--taiwan-rise);
      display: block;
      margin-bottom: 3px;
    }

    /* News list */
    .news-box {
      background: var(--panel-dark);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .news-header {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.05rem;
      color: #fff;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .news-header i {
      color: var(--gold);
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .news-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 12px 14px;
      transition: all 0.2s;
    }

    .news-item:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(212, 175, 55, 0.25);
      transform: translateY(-1px);
    }

    .news-item-title {
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.5;
      color: #fff;
      margin-bottom: 6px;
    }

    .news-item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-faint);
    }

    footer {
      border-top: 1px solid var(--panel-border);
      padding: 30px 40px;
      text-align: center;
      color: var(--text-faint);
      font-size: 0.75rem;
      margin-top: 60px;
      background: rgba(5, 10, 8, 0.9);
    }

    footer p {
      max-width: 800px;
      margin: 8px auto 0;
      line-height: 1.6;
    }

    /* Responsive design */
    @media (max-width: 1200px) {
      main {
        grid-template-columns: 1fr;
        padding: 0 20px;
      }
      .stock-list {
        flex-direction: row;
        overflow-x: auto;
        max-height: none;
        padding-bottom: 10px;
      }
      .stock-card {
        min-width: 250px;
      }
      .charts-container {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .split-grid {
        grid-template-columns: 1fr;
      }
      .metrics-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      header {
        padding: 16px 20px;
      }
    }
  </style>
</head>

    let activeStockId = "2881"; // Default to Fubon Financial
    let priceChart = null;
    let flowChart = null;

    // Helper to format currency
    function fmtPrice(val) {
      return val ? val.toFixed(2) : '--';
    }

    function fmtVol(val) {
      if (!val) return '--';
      return (val / 1000).toLocaleString('zh-TW', {maximumFractionDigits: 0}) + ' 張';
    }

    function fmtChange(val) {
      if (val === undefined || val === null) return '--';
      const pct = (val * 100).toFixed(2);
      return (val > 0 ? '+' : '') + pct + '%';
    }

    // Render stock cards on the sidebar
    function renderStockList() {
      const listEl = document.getElementById('stockList');
      listEl.innerHTML = '';
      
      Object.keys(STOCK_DATA).forEach(id => {
        const stock = STOCK_DATA[id];
        const pInfo = stock.price_info;
        
        const card = document.createElement('div');
        card.className = `stock-card ${id === activeStockId ? 'active' : ''}`;
        card.onclick = () => selectStock(id);
        
        const changeClass = pInfo.ret_1 > 0 ? 'up' : (pInfo.ret_1 < 0 ? 'down' : 'flat');
        const changeIcon = pInfo.ret_1 > 0 ? '▲' : (pInfo.ret_1 < 0 ? '▼' : '▬');
        
        card.innerHTML = `
          <div class="card-top">
            <div class="stock-info">
              <span class="name">${stock.name}</span>
              <span class="code">${id}</span>
            </div>
            <span class="action-tag ${stock.color}">${stock.action}</span>
          </div>
          <div class="card-body">
            <span class="card-price" style="color: ${pInfo.ret_1 > 0 ? 'var(--taiwan-rise)' : (pInfo.ret_1 < 0 ? 'var(--taiwan-fall)' : '#fff')}">${fmtPrice(pInfo.latest_close)}</span>
            <span class="card-change ${changeClass}">${changeIcon} ${fmtChange(pInfo.ret_1)}</span>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    // Switch active stock
    function selectStock(id) {
      if (id === activeStockId) return;
      activeStockId = id;
      
      // Update sidebar active states
      document.querySelectorAll('.stock-card').forEach((card, idx) => {
        const cardId = Object.keys(STOCK_DATA)[idx];
        if (cardId === id) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      });
      
      renderDetails();
    }

    // Render detailed stock view
    function renderDetails() {
      const stock = STOCK_DATA[activeStockId];
      const pInfo = stock.price_info;
      const pePb = stock.pe_pb || {pe: '--', pb: '--', yield: '--'};
      const rev = stock.revenue && stock.revenue.length > 0 ? stock.revenue[0] : {yoy: 0, month: '--'};
      
      const container = document.getElementById('detailsContainer');
      container.innerHTML = `
        <!-- Top Summary Panel -->
        <div class="glass-panel">
          <div class="detail-header-section">
            <div class="detail-title-wrap">
              <div class="category-label"><i class="fa-solid fa-gem"></i> ${stock.category}</div>
              <div class="detail-title-row">
                <h2>${stock.name}</h2>
                <span class="code-badge">${activeStockId}</span>
                <span class="action-tag ${stock.color}" style="font-size: 0.85rem; padding: 4px 12px;">今日策略: ${stock.action}</span>
              </div>
            </div>
            <div class="detail-price-box">
              <div class="detail-price" style="color: ${pInfo.ret_1 > 0 ? 'var(--taiwan-rise)' : (pInfo.ret_1 < 0 ? 'var(--taiwan-fall)' : '#fff')}">${fmtPrice(pInfo.latest_close)}</div>
              <div class="detail-change ${pInfo.ret_1 > 0 ? 'up' : 'down'}">
                ${pInfo.ret_1 > 0 ? '▲' : '▼'} ${fmtChange(pInfo.ret_1)} (昨日收盤)
              </div>
            </div>
          </div>
          
          <div class="summary-card">
            <strong>📊 量化評估簡評：</strong>${stock.desc}
          </div>
          
          <!-- Metrics Row -->
          <div class="metrics-grid" style="margin-top: 24px;">
            <div class="metric-card">
              <div class="metric-title">本益比 (PE)</div>
              <div class="metric-value">${pePb.pe}</div>
              <div class="metric-sub">同業平均約 16.5 倍</div>
            </div>
            <div class="metric-card">
              <div class="metric-title">股價淨值比 (PB)</div>
              <div class="metric-value gold-text">${pePb.pb}</div>
              <div class="metric-sub">低於 1.5 具估值優勢</div>
            </div>
            <div class="metric-card">
              <div class="metric-title">預估殖利率</div>
              <div class="metric-value" style="color: #10b981;">${pePb.yield}%</div>
              <div class="metric-sub">以 2026 最新配息推算</div>
            </div>
            <div class="metric-card">
              <div class="metric-title">最新月營收年增率</div>
              <div class="metric-value" style="color: ${rev.yoy > 0 ? 'var(--taiwan-rise)' : 'var(--taiwan-fall)'};">${rev.yoy.toFixed(1)}%</div>
              <div class="metric-sub">營收月份: ${rev.month} 月</div>
            </div>
          </div>
        </div>

        <!-- Charts Row -->
        <div class="charts-container">
          <div class="chart-box">
            <div class="chart-header">
              <h3><i class="fa-solid fa-chart-line"></i> 近期價格走勢與乖離率</h3>
              <span class="section-note">近5日收盤K線資料</span>
            </div>
            <div class="chart-canvas-wrap">
              <canvas id="priceChartCanvas"></canvas>
            </div>
          </div>
          
          <div class="chart-box">
            <div class="chart-header">
              <h3><i class="fa-solid fa-users-rays"></i> 三大法人籌碼流向</h3>
              <span class="section-note">近5日買賣超口數 (張)</span>
            </div>
            <div class="chart-canvas-wrap">
              <canvas id="flowChartCanvas"></canvas>
            </div>
          </div>
        </div>

        <!-- News and Strategy split -->
        <div class="split-grid">
          <!-- Left: News list -->
          <div class="news-box">
            <div class="news-header">
              <h3><i class="fa-regular fa-newspaper"></i> 近期相關新聞輿情</h3>
            </div>
            <div class="news-list" id="newsList">
              <!-- Rendered via JS -->
            </div>
          </div>
          
          <!-- Right: Strategy and limits -->
          <div class="strategy-box">
            <div class="strategy-title">
              <h3><i class="fa-solid fa-shield-halved"></i> 交易策略與風控指引</h3>
            </div>
            <table class="strategy-table">
              <tr>
                <td class="label">建議佈局區間</td>
                <td class="val entry">${stock.range} 元</td>
              </tr>
              <tr>
                <td class="label">波段目標價</td>
                <td class="val target">${stock.target} 元</td>
              </tr>
              <tr>
                <td class="label">風控停損價</td>
                <td class="val stop">${stock.stop} 元</td>
              </tr>
              <tr>
                <td class="label">5日漲跌幅</td>
                <td class="val" style="color: ${pInfo.ret_5 > 0 ? 'var(--taiwan-rise)' : 'var(--taiwan-fall)'};">${fmtChange(pInfo.ret_5)}</td>
              </tr>
              <tr>
                <td class="label">量能擴張比</td>
                <td class="val">${pInfo.vol_ratio.toFixed(2)} 倍</td>
              </tr>
            </table>
            
            <div class="warning-panel">
              <strong>⚠️ 風險管理提醒：</strong>
              金融指數創歷史新高，短線正乖離偏大，交易上務必遵循「分批不追高」原則，嚴格執行風控停損。
            </div>
          </div>
        </div>
      `;

      // Render News
      const newsListEl = document.getElementById('newsList');
      if (stock.news && stock.news.length > 0 && stock.news[0].title !== "") {
        stock.news.forEach(item => {
          const div = document.createElement('div');
          div.className = 'news-item';
          
          // Determine sentiment based on title keywords
          let sentiment = 'neutral';
          let sentimentLabel = '中性';
          
          if (/買超|大漲|大增|飆|創新高|創同期新高|強勁/i.test(item.title)) {
            sentiment = 'positive';
            sentimentLabel = '偏多';
          } else if (/賣超|跌|大賣|下挫|衰退|大減|失望/i.test(item.title)) {
            sentiment = 'negative';
            sentimentLabel = '偏空';
          }
          
          div.innerHTML = `
            <div class="news-item-title">${item.title}</div>
            <div class="news-item-meta">
              <span>${item.date ? item.date.replace(' GMT', '') : '即時新聞'}</span>
              <span class="sentiment-tag ${sentiment}">${sentimentLabel}</span>
            </div>
          `;
          newsListEl.appendChild(div);
        });
      } else {
        newsListEl.innerHTML = '<div class="news-item" style="color: var(--text-faint); text-align:center;">無近期相關新聞</div>';
      }

      // Render Charts
      initCharts(stock);
    }

    // Initialize Chart.js charts
    function initCharts(stock) {
      if (priceChart) priceChart.destroy();
      if (flowChart) flowChart.destroy();

      const pInfo = stock.price_info;
      const prices = pInfo.closes_recent;
      const dates = pInfo.dates_recent;
      
      const priceCtx = document.getElementById('priceChartCanvas').getContext('2d');
      priceChart = new Chart(priceCtx, {
        type: 'line',
        data: {
          labels: dates,
          datasets: [
            {
              label: '收盤價 (元)',
              data: prices,
              borderColor: '#d4af37',
              backgroundColor: 'rgba(212, 175, 55, 0.1)',
              borderWidth: 3,
              fill: true,
              tension: 0.15,
              pointBackgroundColor: '#ffffff',
              pointBorderColor: '#d4af37',
              pointRadius: 5,
              pointHoverRadius: 7
            },
            {
              label: '5日均線 (MA5)',
              data: Array(dates.length).fill(pInfo.ma5),
              borderColor: 'rgba(239, 68, 68, 0.5)',
              borderWidth: 1.5,
              borderDash: [5, 5],
              fill: false,
              pointRadius: 0
            },
            {
              label: '20日均線 (MA20)',
              data: Array(dates.length).fill(pInfo.ma20),
              borderColor: 'rgba(59, 130, 246, 0.5)',
              borderWidth: 1.5,
              borderDash: [5, 5],
              fill: false,
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { color: '#9ca3af', font: { family: 'Noto Sans TC' } }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#9ca3af' }
            },
            y: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#9ca3af' }
            }
          }
        }
      });

      // Flow Chart (institutional net buying)
      const instData = stock.institutional || [];
      const instDates = instData.map(d => d.date);
      const foreign = instData.map(d => d.foreign_net / 1000); // in thousands
      const trust = instData.map(d => d.trust_net / 1000);

      const flowCtx = document.getElementById('flowChartCanvas').getContext('2d');
      flowChart = new Chart(flowCtx, {
        type: 'bar',
        data: {
          labels: instDates,
          datasets: [
            {
              label: '外資 (張)',
              data: foreign,
              backgroundColor: 'rgba(239, 68, 68, 0.85)',
              borderColor: 'rgba(239, 68, 68, 1)',
              borderWidth: 1
            },
            {
              label: '投信 (張)',
              data: trust,
              backgroundColor: 'rgba(59, 130, 246, 0.85)',
              borderColor: 'rgba(59, 130, 246, 1)',
              borderWidth: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { color: '#9ca3af', font: { family: 'Noto Sans TC' } }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#9ca3af' }
            },
            y: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#9ca3af' }
            }
          }
        }
      });
    }

    // Init onload
    window.onload = () => {
      renderStockList();
      renderDetails();
    };
  </script>
